services:
  backend:
    build: ./backend
    container_name: em_backend
    restart: always
    environment:
      - PORT=${APP_PORT}
    expose:
      - "${APP_PORT}"
    networks:
      - em_network

  nginx:
    image: nginx:stable-alpine
    container_name: em_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - em_network

networks:
  em_network:
    driver: bridge

